<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜水记录</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 17px; margin: 16px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.secondary { background: #64777b; }
    button.small { padding: 6px 10px; font-size: 12px; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 64px; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    .app { display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .map { position: relative; height: calc(100vh - 128px); min-height: 560px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .list { display: grid; gap: 8px; max-height: 330px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .timeline { display: grid; gap: 8px; max-height: 330px; overflow: auto; }
    .pill { display: inline-block; padding: 3px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; }
    .sealed-pill { border-color: #1d6c78; color: #1d6c78; }
    .muted { color: #5c7378; font-size: 13px; }
    .sealbar { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-bottom: 6px; }
    .notice { margin: 6px 0 0; font-size: 13px; color: #5c7378; min-height: 18px; }
    .notice.warn { color: #9a5a1e; font-weight: 700; }
    .draft-item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; margin-bottom: 8px; background: #f7fbfb; }
    .draft-item.has-conflict { border-color: #c98a3f; background: #fdf6ec; }
    .conflict { margin-top: 8px; padding: 8px; border: 1px dashed #c98a3f; border-radius: 6px; font-size: 13px; background: #fff; }
    .draft-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    @media (max-width: 980px) { header { display: block; } .app { grid-template-columns: 1fr; } .map { height: 560px; } }
  </style>
</head>
<body>
  <header>
    <div><h1>水下考古潜水记录</h1><div class="muted">换班改动先入确认草稿；潜次封存后只进修订履历，页面与导出沿用封存版。</div></div>
    <button id="exportBtn">导出JSON</button>
  </header>
  <main class="app">
    <section class="panel">
      <div class="map" id="map"><div class="wreck"></div></div>
    </section>
    <aside class="panel">
      <label>当前班次（提交人）</label>
      <input id="shift" placeholder="例如：乙班 / 张潜">
      <div class="sealbar">
        <select id="sealDive"><option value="">选择潜次…</option></select>
        <button type="button" id="sealBtn" class="small">封存潜次</button>
      </div>
      <div id="notice" class="notice"></div>

      <h2>待确认草稿</h2>
      <div id="draftList"></div>

      <div class="toolbar">
        <select id="filter"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
        <select id="view">
          <option value="list">标记列表</option>
          <option value="timeline">潜次时间线</option>
          <option value="history">修订履历</option>
        </select>
      </div>
      <form id="form">
        <h2>标记信息</h2>
        <input name="id" type="hidden">
        <label>编号</label><input name="code" required>
        <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
        <label>潜次</label><input name="dive" placeholder="例如DIVE-04" required>
        <label>深度</label><input name="depth" placeholder="例如18.4m" required>
        <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
        <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
        <label>备注</label><textarea name="note"></textarea>
        <div class="toolbar"><button>保存（入草稿）</button><button type="button" id="deleteBtn" class="secondary">移除（入草稿）</button></div>
        <div id="formHint" class="muted"></div>
      </form>
      <h2 id="listTitle">标记列表</h2>
      <div id="list" class="list"></div>
    </aside>
  </main>
  <script src="rules.js"></script>
  <script src="archive.js"></script>
  <script src="page.js"></script>
</body>
</html>
